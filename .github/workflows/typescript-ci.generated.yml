name: TypeScript CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    strategy:
      matrix:
        node: [24.19.0, 26]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Enable the pinned package manager
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Generate, build, test, typecheck and lint
        run: make typescript-build typescript-test typescript-lint

  linux-runtime-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Enable the pinned package manager
        run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Coverage build and tests
        run: make typescript-coverage
      - name: Start a generated service with the Node inspector
        run: make debug-analyticsservice
      - name: Verify the inspector endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:2345/json/list > /tmp/node-inspector.json; then
              test -s /tmp/node-inspector.json
              exit 0
            fi
            sleep 1
          done
          docker compose logs --no-color analyticsservice
          exit 1
      - name: Stop debug services
        if: always()
        run: docker compose down --volumes --remove-orphans

  runtime-images:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build independent production images
        run: make typescript-docker-build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@11.18.0 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Record production dependency licenses
        run: mkdir -p .artifacts/security && corepack pnpm licenses list --prod --json > .artifacts/security/dependency-licenses.json
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: .artifacts/security/sbom.spdx.json
      - name: Enforce the high-severity vulnerability policy
        run: corepack pnpm audit --prod --audit-level high
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-supply-chain
          path: .artifacts/security
