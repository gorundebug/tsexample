stages:
  - quality
  - build

typescript-quality:
  image: node:24.19.0-bookworm
  stage: quality
  script:
    - corepack enable
    - if [ -f pnpm-lock.yaml ]; then corepack pnpm install --frozen-lockfile; else corepack pnpm install; fi
    - make lint
    - make test

typescript-image:
  image: docker:29.7.2-cli
  stage: build
  services:
    - docker:29.7.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash make
  script:
    - make docker-build RUNTIME_IMAGE=1
