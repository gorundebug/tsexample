services:
  automationservice:
    image: automationservice-typescript-development:latest
    build:
      target: development
    entrypoint: /bin/sh
    working_dir: /workspace/service
    command:
      - -c
      - >-
        prepare-local-build /workspace/source /workspace/service
        && cd /workspace/service
        && exec ./scripts/run-service.generated.sh ./src/main.generated.ts
        --config ./config/config.yaml
        --values ./config/docker_overrides.yaml
    environment:
      NODE_DIAGNOSTIC_DIR: /workspace/service/.artifacts/node-diagnostics
    ports:
      - "${DEBUG_PORT:-2345}:2345"
    volumes:
      - .:/workspace/source:ro
      - typescript-artifacts:/workspace/artifacts

volumes:
  typescript-artifacts:
