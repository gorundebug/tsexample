services:
  inventoryservice:
    build:
      context: .
      dockerfile: Dockerfile.standalone.generated
      target: ${SERVICEGEN_DOCKER_TARGET:-development}
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        CONFLUENT_KAFKA_JAVASCRIPT_BINARY_HOST_MIRROR: ${SERVICEGEN_GITHUB_RAW_URL:-https://github.com}/confluentinc/confluent-kafka-javascript/releases/download/
    image: inventoryservice-typescript:latest
    command: ["--config", "config/config.yaml", "--values", "config/docker_overrides.yaml"]
    environment:
      - DEBUG=${DEBUG:-0}
      - NODE_DIAGNOSTIC_DIR=/workspace/.artifacts/node-diagnostics
    ports:
      - "9092:9092"
      - "9202:9202"
      - "2345:2345"
